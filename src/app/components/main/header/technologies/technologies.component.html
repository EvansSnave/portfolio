<section>
  <ul>
    <li *ngFor="let tech of technologies | keyvalue">    
      @defer (on viewport){
        <a [href]="tech.value.link" target="_blank"><img [src]="tech.value.image_url" [alt]="tech.value.title"></a>
      } @placeholder {
        <div>...</div>
      } @loading {
        <div>...Loading</div>
      }
